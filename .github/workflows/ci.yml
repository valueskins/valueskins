name: CI

# Runs on every pull request to main. The main branch requires the "Checks"
# job to pass before a pull request can be merged, so anything that fails here
# cannot reach production.
#
# This file used to be decoration: the type check and lint could not fail
# (`continue-on-error` plus `|| true`), and the test job was a single `echo`.
# Changes shipped untested, which is how the same things kept breaking.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A real Postgres, because the tests that matter drive the real handlers
    # against a real database: who may post, who may apply, who sees what.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vs_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: marketplace

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vs_ci
      PGPASSWORD: postgres
      # Placeholders so the build and the tests never reach a real service.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vs_ci
      RAZORPAY_KEY_ID: rzp_test_ci
      RAZORPAY_KEY_SECRET: ci
      NEXT_PUBLIC_APP_URL: https://www.valueskins.com
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketplace/package-lock.json

      - name: Install
        run: npm ci

      - name: Type check (may not get worse)
        run: ./scripts/typecheck-ratchet.sh

      - name: Create the database schema
        run: bash scripts/ci-setup-db.sh

      - name: Tests
        run: npx jest --runInBand --ci

      - name: Payment invariants
        run: psql -h localhost -U postgres -d vs_ci -v ON_ERROR_STOP=1 -f scripts/verify-payment-invariants.sql

      - name: Build
        run: npx next build
